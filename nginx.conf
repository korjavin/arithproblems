# Replaces nginx:alpine's /etc/nginx/conf.d/default.conf.
#
# script.js is loaded as script.js?v=<commit>, but the modules it imports
# (ui/*.js, generators/*.js) and the locales/*.json it fetches have no
# version in their URL. Without a Cache-Control header browsers may reuse
# old copies after a deploy, so a new topic meets an old locale file and
# renders nothing. "no-cache" makes the browser revalidate every file
# (a cheap 304 via ETag when unchanged).
server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
